# - hook: 방송 첫머리에 던질 생활 공감 한마디 / takeaway: 청취자가 기억할 한 문장(클로징에서 반복)
# - status: done(원고 완료) / todo
# category: 입문 · 생활 · 업무 · 가족 · 외주의뢰 · 안전

